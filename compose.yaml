name: pulse

services:
  caddy:
    image: caddy:2.11.4
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      NODE_ENV: development
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  backend:
    build: ./backend
    volumes:
      # Committed, deterministic identity dataset (seed/data/identity/*.csv).
      # Read by the entrypoint's seed loader on first boot; kept out of the
      # image so a regenerate does not force a rebuild. clinical/ is Phase 2.
      - ./seed/data:/seed/data:ro
      - pulse_uploads:/data/uploads
    environment:
      DATABASE_URL: postgresql+asyncpg://pulse_app:pulse_app@postgres:5432/pulse
      REDIS_URL: redis://redis:6379/0
      # Defaults keep a fresh clone working with Mailpit. A local .env or host
      # environment can select Gmail SMTP without changing this file.
      SMTP_HOST: "${SMTP_HOST:-mailpit}"
      SMTP_PORT: "${SMTP_PORT:-1025}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_STARTTLS: "${SMTP_STARTTLS:-false}"
      SMTP_SSL: "${SMTP_SSL:-false}"
      MAIL_FROM: "${MAIL_FROM:-}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-http://localhost}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Healthy only once entrypoint migrations + seed finished and uvicorn is serving.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/ready')"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: pulse
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
    volumes:
      - pulse_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.8.2
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.0
    ports:
      - "8025:8025"

volumes:
  pulse_pgdata:
  pulse_uploads:
