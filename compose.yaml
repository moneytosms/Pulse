name: pulse

services:
  caddy:
    image: caddy:2.11.4
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      - frontend
      - backend

  frontend:
    build: ./frontend
    environment:
      NODE_ENV: development

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://pulse_app:pulse_app@postgres:5432/pulse
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: pulse
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
    volumes:
      - pulse_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:8.8.2

  mailpit:
    image: axllent/mailpit:v1.31.0
    ports:
      - "8025:8025"

volumes:
  pulse_pgdata:
