<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">Pulse architecture</title>
  <desc id="d">Browser to Caddy. Caddy routes /api to FastAPI and everything else to Next.js. FastAPI uses PostgreSQL and Redis.</desc>
  <rect width="1200" height="300" rx="26" fill="#fbf3f4"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="25.5" fill="none" stroke="#e8cdd2"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="20" fill="#2e1a1f" text-anchor="middle">
    <g stroke="#7b1e3a" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M230 150 H320"/><path d="M500 150 H540 V90 H620"/><path d="M500 150 H540 V210 H620"/>
      <path d="M840 90 H880 V60 H940"/><path d="M880 90 V120 H940" />
    </g>
    <rect x="60" y="120" width="170" height="60" rx="14" fill="#fffafa" stroke="#e8cdd2"/><text x="145" y="157">browser</text>
    <rect x="320" y="120" width="180" height="60" rx="14" fill="#7b1e3a"/><text x="410" y="157" fill="#fff">Caddy</text>
    <rect x="620" y="60" width="220" height="60" rx="14" fill="#fffafa" stroke="#e8cdd2"/><text x="730" y="97">/api  FastAPI</text>
    <rect x="620" y="180" width="220" height="60" rx="14" fill="#fffafa" stroke="#e8cdd2"/><text x="730" y="217">/*  Next.js</text>
    <rect x="940" y="30" width="200" height="60" rx="14" fill="#f2dfe2" stroke="#e8cdd2"/><text x="1040" y="67">PostgreSQL</text>
    <rect x="940" y="100" width="200" height="60" rx="14" fill="#f2dfe2" stroke="#e8cdd2"/><text x="1040" y="137">Redis</text>
  </g>
  <text x="940" y="200" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" fill="#6b4a51">Redis: sessions, rate limits,</text>
  <text x="940" y="224" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" fill="#6b4a51">short-lived tokens</text>
</svg>
