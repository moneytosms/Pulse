<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">Pulse</title>
  <desc id="d">Pulse, a lifelong electronic health record. A heartbeat line runs into an access log: a clinician read granted by the patient, then revoked.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbf3f4"/><stop offset="1" stop-color="#f6e4e7"/></linearGradient>
  </defs>
  <rect width="1200" height="400" rx="26" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="399" rx="25.5" fill="none" stroke="#e8cdd2"/>
  <g id="title-block" transform="translate(64 64)">
    <text font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" letter-spacing="3" fill="#8f5a66">ELECTRONIC HEALTH RECORD · CONSENT-FIRST</text>
    <text y="92" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="84" font-weight="800" fill="#2e1a1f" letter-spacing="-2">Pulse</text>
    <text y="146" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="28" fill="#4a3338">Your history, for life.</text>
    <text y="182" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="28" fill="#4a3338">Shared only with who you choose.</text>
    <text y="218" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="28" font-weight="700" fill="#7b1e3a">Every access recorded.</text>
    <g transform="translate(0 256)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" fill="#8f5a66">
      <text>FastAPI · Next.js · PostgreSQL</text>
      <text y="26">EN · हिन्दी · தமிழ் · മലയാളം</text>
    </g>
  </g>
  <g id="proof" transform="translate(640 30)">
    <path d="M0 64 H90 L110 64 L128 18 L150 112 L170 40 L184 64 H500" fill="none" stroke="#7b1e3a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="500" cy="64" r="8" fill="#7b1e3a"/>
    <g transform="translate(0 136)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16">
      <rect width="500" height="52" rx="12" fill="#fffafa" stroke="#e8cdd2"/>
      <circle cx="26" cy="26" r="7" fill="#5c7355"/>
      <text x="46" y="32" fill="#2e1a1f">Patient grants   Dr. Rao · labs · 7 days</text>
      <g transform="translate(0 64)">
        <rect width="500" height="52" rx="12" fill="#fffafa" stroke="#e8cdd2"/>
        <circle cx="26" cy="26" r="7" fill="#7b1e3a"/>
        <text x="46" y="32" fill="#2e1a1f">Clinician reads  lab report #2041</text>
      </g>
      <g transform="translate(0 128)">
        <rect width="500" height="52" rx="12" fill="#fffafa" stroke="#e8cdd2"/>
        <circle cx="26" cy="26" r="7" fill="#a85f42"/>
        <text x="46" y="32" fill="#2e1a1f">Patient revokes  access closed</text>
      </g>
    </g>
    <text x="500" y="342" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#8f5a66">append-only audit log · illustrative</text>
  </g>
</svg>
