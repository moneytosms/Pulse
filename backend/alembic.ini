[alembic]
script_location = app/db/migrations
prepend_sys_path = .
version_path_separator = os

# DATABASE_URL env var is read in env.py; this is only a fallback for
# offline (--sql) mode when the env var isn't set.
sqlalchemy.url = postgresql+asyncpg://pulse_app:pulse_app@postgres:5432/pulse

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
